<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Установка удалённых приложений</title>

<style>
:root {
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --border-soft: #f1f5f9;

    --text: #0f172a;
    --muted: #64748b;
    --muted-light: #94a3b8;

    --accent: #2563eb;
    --accent-hover: #1d4ed8;

    --shadow:
        0 4px 6px -1px rgba(0, 0, 0, 0.05),
        0 2px 4px -2px rgba(0, 0, 0, 0.05);

    --spring: cubic-bezier(.22,1,.36,1);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    font-weight: 500;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100dvh;
    overflow-x: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    color: var(--text);
    background-color: var(--bg);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding:
        max(20px, env(safe-area-inset-top))
        0
        max(30px, env(safe-area-inset-bottom));
}

/* --------------------------------------------------
   MAIN CONTAINERS
-------------------------------------------------- */

.container {
    width: 100%;
    max-width: 430px;
    padding: 0 18px max(10px, env(safe-area-inset-bottom));
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin: auto 0;
}

/* --------------------------------------------------
   HEADER
-------------------------------------------------- */

.header-section {
    margin-bottom: 20px;
}

h1 {
    margin: 0 0 9px;
    text-align: center;
    font-size: 24px;
    line-height: 1.15;
    letter-spacing: -.5px;
    font-weight: 700 !important;
    color: var(--text);
}

/* --------------------------------------------------
   MAIN CARD
-------------------------------------------------- */

.card {
    position: relative;
    overflow: hidden;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    border-radius: 24px;
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600 !important;
}

/* --------------------------------------------------
   SELECT
-------------------------------------------------- */

.custom-select-btn {
    position: relative;
    width: 100%;
    min-height: 52px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    border-radius: 14px;
    border: 1px solid var(--border);
    background-color: #f8fafc;
    color: var(--text);
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s ease, background-color 0.2s ease;
}

.custom-select-btn span {
    font-size: 14px;
}

.custom-select-btn::after {
    content: "›";
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background-color: var(--border);
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
}

.custom-select-btn:hover {
    border-color: var(--accent);
    background-color: #fff;
}

/* --------------------------------------------------
   BUTTONS
-------------------------------------------------- */

.btn {
    position: relative;
    width: 100%;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    border-radius: 14px;
    border: none;
    background-color: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 650 !important;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.2s ease;
}

.btn:hover {
    background-color: var(--accent-hover);
}

.btn:active {
    transform: scale(.98);
}

/* --------------------------------------------------
   PROGRESS CONTAINER
-------------------------------------------------- */

.progress-container {
    width: 100%;
    margin-top: 4px;
    display: none;
    flex-direction: column;
}

.progress-container.active {
    display: flex;
}

.progress-box {
    position: relative;
    width: 100%;
    padding: 16px 20px;
    border-radius: 16px;
    background-color: #f1f5f9;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13.5px;
    font-weight: 650;
    color: var(--text);
}

#progressStatus {
    color: var(--text);
}

#progressText {
    color: var(--accent);
    font-size: 14px;
    font-weight: 700;
}

.progress-track {
    width: 100%;
    height: 8px;
    background-color: var(--border);
    border-radius: 999px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background-color: var(--accent);
    border-radius: 999px;
    transition: width 0.1s linear;
}

/* --------------------------------------------------
   SHEET OVERLAY & MODAL
-------------------------------------------------- */

.sheet-overlay {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s ease, visibility .25s ease;
}

.sheet-overlay.active {
    opacity: 1;
    visibility: visible;
}

.sheet-modal {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: min(72vh, 520px);
    max-height: calc(100dvh - 30px);
    display: flex;
    flex-direction: column;
    padding: 20px 16px 16px;
    overflow: hidden;
    border-radius: 24px;
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    transform: translateY(15px);
    opacity: 0;
    transition: transform .3s var(--spring), opacity .25s ease;
}

.sheet-overlay.active .sheet-modal {
    transform: translateY(0);
    opacity: 1;
}

.sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
}

.sheet-title {
    font-size: 16px;
    font-weight: 650 !important;
    color: var(--text);
}

.sheet-close {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--border);
    background-color: transparent;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.2s ease;
}

.sheet-close:hover {
    background-color: var(--border-soft);
}

.app-search-wrap {
    position: relative;
    flex-shrink: 0;
    margin-bottom: 12px;
}

.app-search {
    width: 100%;
    height: 44px;
    padding: 0 38px;
    border-radius: 12px;
    border: 1px solid var(--border);
    outline: none;
    background-color: #f8fafc;
    color: var(--text);
    font-size: 13.5px;
    transition: border-color 0.2s ease;
}

.app-search::placeholder {
    color: var(--muted-light);
}

.app-search:focus {
    border-color: var(--accent);
    background-color: #fff;
}

.search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted-light);
    font-size: 15px;
    pointer-events: none;
}

.search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 50%;
    background-color: var(--border);
    color: var(--muted);
    cursor: pointer;
}

.search-clear.visible {
    display: flex;
}

/* --------------------------------------------------
   SHEET LIST
-------------------------------------------------- */
.sheet-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    padding-right: 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
}

.sheet-list::-webkit-scrollbar {
    width: 4px;
}

.sheet-list::-webkit-scrollbar-thumb {
    background-color: var(--border);
    border-radius: 10px;
}

.sheet-item {
    min-height: 44px;
    padding: 10px 14px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #f8fafc;
    border: 1px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s ease;
}

.sheet-item:hover {
    background-color: #f1f5f9;
    border-color: var(--muted-light);
}

.sheet-item.selected {
    background-color: #eff6ff;
    border-color: var(--accent);
}

.sheet-info-box {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
}

.sheet-item span.app-name {
    color: var(--text);
    font-size: 13.5px;
    font-weight: 550 !important;
}

.search-empty {
    display: none;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px 10px;
}
</style>
</head>

<body>

<script>
let selectedAppUrl = "";
let selectedAppName = "";
let isInstalling = false;

function updateAppCounter() {
    const totalApps = document.querySelectorAll('.sheet-list .sheet-item').length;
    const counterElement = document.getElementById('app-counter-text');
    
    if (counterElement) {
        let word = 'приложений';
        const lastDigit = totalApps % 10;
        const lastTwoDigits = totalApps % 100;

        if (lastTwoDigits < 11 || lastTwoDigits > 14) {
            if (lastDigit === 1) word = 'приложение';
            else if (lastDigit >= 2 && lastDigit <= 4) word = 'приложения';
        }

        counterElement.textContent = `Всего ${totalApps} ${word}`;
    }
}

document.addEventListener("DOMContentLoaded", function() {
    updateAppCounter();

    const searchInput = document.getElementById("appSearchInput");
    if (searchInput) {
        searchInput.addEventListener("input", filterApps);
        searchInput.addEventListener("keydown", function(e) {
            if (e.key === "Escape") {
                clearAppSearch();
                searchInput.blur();
            }
        });
    }
});

function openSheet() {
    const searchInput = document.getElementById("appSearchInput");
    if (searchInput) {
        searchInput.value = "";
        document.getElementById("searchClear").classList.remove("visible");
    }
    filterApps();
    document.getElementById("sheetOverlay").classList.add("active");
}

function closeSheet() {
    const searchInput = document.getElementById("appSearchInput");
    if (searchInput) {
        searchInput.value = "";
        searchInput.blur();
    }
    document.getElementById("sheetOverlay").classList.remove("active");
    filterApps();
}

function filterApps() {
    const input = document.getElementById("appSearchInput");
    const query = input ? input.value.trim().toLowerCase() : "";
    const clearBtn = document.getElementById("searchClear");
    const emptyMessage = document.getElementById("searchEmpty");

    if (clearBtn) {
        if (query) clearBtn.classList.add("visible");
        else clearBtn.classList.remove("visible");
    }

    let visibleCount = 0;

    document.querySelectorAll(".sheet-item").forEach(item => {
        const appNameElement = item.querySelector(".app-name");
        if (!appNameElement) return;

        const name = appNameElement.textContent.toLowerCase();
        const matchesQuery = name.includes(query);

        if (!matchesQuery) {
            item.style.display = "none";
            return;
        }

        item.style.display = "flex";
        visibleCount++;
    });

    if (emptyMessage) {
        emptyMessage.style.display = visibleCount === 0 ? "block" : "none";
    }
}

function clearAppSearch() {
    const input = document.getElementById("appSearchInput");
    if (!input) return;
    input.value = "";
    filterApps();
    input.focus();
}

function selectApp(element, url, name) {
    selectedAppUrl = url;
    selectedAppName = name;

    const selectedTextEl = document.getElementById("selectedAppText");
    selectedTextEl.textContent = name;
    selectedTextEl.style.color = "var(--text)";

    document.querySelectorAll(".sheet-item").forEach(item => {
        item.classList.remove("selected");
    });
    element.classList.add("selected");

    closeSheet();
}

function startInstallation() {
    if (!selectedAppUrl || isInstalling) {
        alert("Пожалуйста, выберите приложение из списка");
        return;
    }

    executeDownload();
}

function executeDownload() {
    isInstalling = true;

    const progressContainer = document.getElementById("progressContainer");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");
    const progressStatus = document.getElementById("progressStatus");

    progressContainer.classList.add("active");
    progressFill.style.width = "0%";
    progressText.textContent = "0%";
    progressStatus.textContent = "Подготовка...";

    const duration = 5000;
    const intervalTime = 100;
    let elapsed = 0;

    const timer = setInterval(() => {
        elapsed += intervalTime;
        let percent = Math.min(Math.floor((elapsed / duration) * 100), 100);

        progressFill.style.width = percent + "%";
        progressText.textContent = percent + "%";

        if (percent >= 70 && progressStatus.textContent !== "Установка...") {
            progressStatus.textContent = "Установка...";
        }

        if (elapsed >= duration) {
            clearInterval(timer);
            isInstalling = false;
            progressStatus.textContent = "Готово!";
            
            setTimeout(() => {
                progressContainer.classList.remove("active");
            }, 2000);
        }
        
    }, intervalTime);

    // Пример перехода по ссылке (демо-режим для настройки)
    // window.location.href = selectedAppUrl;
}
</script>

<!-- ==================================================
     MAIN SCREEN
================================================== -->

<div class="container" id="mainApp">
    <div class="header-section">
        <h1>
            Установка удалённых<br>
            приложений
        </h1>
    </div>

    <div class="card">
        <label>
            Выберите приложение
        </label>
        <button
            type="button"
            class="custom-select-btn"
            onclick="openSheet()"
        >
            <span id="selectedAppText" style="color: var(--muted-light);">
                Нажмите для выбора приложения
            </span>
        </button>
        <button
            type="button"
            class="btn"
            onclick="startInstallation()"
        >
            Установить
        </button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-box">
                <div class="progress-info">
                    <span id="progressStatus">Подготовка...</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="progress-track">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ==================================================
     APP SELECTION SHEET
================================================== -->

<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()">
    <div class="sheet-modal" onclick="event.stopPropagation()">
        <div class="sheet-header">
            <div class="sheet-title" id="app-counter-text">
                Выбор приложения
            </div>
            <button
                type="button"
                class="sheet-close"
                onclick="closeSheet()"
            >
                ✕
            </button>
        </div>

        <div class="app-search-wrap">
            <span class="search-icon">⌕</span>
            <input
                type="search"
                id="appSearchInput"
                class="app-search"
                placeholder="Поиск по названию..."
                autocomplete="off"
                autocorrect="off"
                autocapitalize="none"
                spellcheck="false"
            >
            <button
                type="button"
                id="searchClear"
                class="search-clear"
                onclick="clearAppSearch()"
                aria-label="Очистить поиск"
            >
                ✕
            </button>
        </div>

        <div id="searchEmpty" class="search-empty">
            🔎 Ничего не найдено
        </div>

        <div class="sheet-list">
            <div
                class="sheet-item"
                onclick="selectApp(this, '#', 'Приложение 1')"
            >
                <div class="sheet-info-box">
                    <span class="app-name">Приложение 1 (Образец)</span>
                </div>
            </div>
      
            <div
                class="sheet-item"
                onclick="selectApp(this, '#', 'Приложение 2')"
            >
                <div class="sheet-info-box">
                    <span class="app-name">Приложение 2 (Образец)</span>
                </div>
            </div>

                  <!-- НАЗВАНИЕ ПРИЛОЖЕНИЯ -->
            <div
                class="sheet-item"
                data-key="ИМЯ ПЛИСТ"
                onclick="selectApp(this, 'itms-services://?action=download-manifest&url=https://app-installer-ios.github.io/store/mtsdengi.plist', 'НАЗВАНИЕ', 'ИМЯ ПЛИСТ')"
            >
                </div>
                <span class="ios-badge">iOS 14.0+</span>
            </div>
            
            </div>
        </div>
    </div>
</div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS App Portal</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(235, 235, 245, 0.6);
            --accent: #0A84FF;
            --accent-glow: rgba(10, 132, 255, 0.3);
            --success: #30D158;
            --blur: blur(25px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        /* Фоновые градиентные переливы для объема */
        .ambient-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(10,132,255,0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
            pointer-events: none;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
            margin-top: 12px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Карточка приложения в стиле iOS Widget */
        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .app-card:active {
            transform: scale(0.97);
        }

        .app-icon {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }

        .app-info {
            flex-grow: 1;
            min-width: 0;
        }

        .app-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .app-version {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--text-primary);
        }

        /* Кнопка установки в стиле App Store */
        .install-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 980px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--accent-glow);
            transition: opacity 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .install-btn:active {
            opacity: 0.8;
            transform: scale(0.95);
        }

        /* Прогресс-бар загрузки */
        .progress-container {
            margin-top: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: var(--blur);
            border-radius: 20px;
            padding: 16px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 45%; /* Динамическое значение */
            border-radius: 3px;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--accent);
        }

        /* Системные уведомления / подсказки */
        .toast-tip {
            margin-top: 24px;
            background: rgba(255, 159, 10, 0.1);
            border: 1px solid rgba(255, 159, 10, 0.2);
            border-radius: 16px;
            padding: 14px 16px;
            font-size: 13px;
            line-height: 1.4;
            color: #FFD60A;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <header>
        <h1>Каталог приложений</h1>
        <p>Безопасная установка через GitHub Pages</p>
    </header>

    <div class="container">
        <!-- Карточка приложения 1 -->
        <div class="app-card">
            <img src="icon.png" alt="App Icon" class="app-icon">
            <div class="app-info">
                <div class="app-title">Custom Client</div>
                <div class="app-meta">Утилита для iOS</div>
                <span class="app-version">v2.4.1</span>
            </div>
            <button class="install-btn" onclick="location.href='itms-services://?action=download-manifest&url=https://your-domain.github.io/manifest.plist'">Установить</button>
        </div>

        <!-- Интерактивный прогресс (активируется при установке) -->
        <div class="progress-container">
            <div class="progress-info">
                <span>Установка приложения...</span>
                <span>45%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Подсказка для пользователя -->
        <div class="toast-tip">
            <span>💡</span>
            <div>После нажатия «Установить» сверните браузер и проверьте рабочий стол вашего iPhone.</div>
        </div>
    </div>

</body>
</html>

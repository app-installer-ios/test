<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f9f9fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Установка удалённых приложений</title>

<style>
:root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --border: #e1e1e6;
    --text: #1d1d1f;
    --muted: #86868b;
    --accent: #0066cc;
    --spring: cubic-bezier(.22,1,.36,1);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    font-weight: 500;
}

html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100dvh;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 0 max(30px, env(safe-area-inset-bottom));
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 0 18px max(10px, env(safe-area-inset-bottom));
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin: auto 0;
    animation: screenIn .4s var(--spring);
}

@keyframes screenIn {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.header-section { margin-bottom: 20px; }

h1 {
    margin: 0 0 6px;
    text-align: center;
    font-size: 24px;
    line-height: 1.15;
    letter-spacing: -.6px;
    font-weight: 700;
    color: var(--text);
}

.card {
    position: relative;
    overflow: hidden;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    border-radius: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,.04);
}

label { font-size: 13px; color: var(--muted); font-weight: 600; }

.custom-select-btn {
    position: relative;
    width: 100%;
    min-height: 52px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #fbfbfd;
    color: var(--text);
    outline: none;
    cursor: pointer;
    transition: all .2s ease;
}

.custom-select-btn span { font-size: 14px; }

.custom-select-btn::after {
    content: "›";
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.04);
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
    transition: transform .2s ease;
}

.custom-select-btn:hover { border-color: #d1d1d6; }
.custom-select-btn:active { transform: scale(.98); }

.btn {
    position: relative;
    width: 100%;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #ffffff;
    font-size: 14.5px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
    transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
}

.btn:hover { filter: brightness(1.05); }
.btn:active { transform: scale(.98); filter: brightness(.95); }

.support-notice {
    width: 100%;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fbfbfd;
}

.support-notice a { color: var(--accent); text-decoration: none; font-weight: 600; }
.support-notice a:hover { text-decoration: underline; }

.progress-container {
    width: 100%;
    margin-top: 4px;
    display: none;
    flex-direction: column;
    animation: screenIn .3s var(--spring);
}

.progress-container.active { display: flex; }

.progress-box {
    position: relative;
    overflow: hidden;
    width: 100%;
    padding: 16px 20px;
    border-radius: 16px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,.06);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.progress-box.completed { border-color: #34c759; }

.progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
}

#progressStatus { color: var(--text); }
#progressText { color: var(--accent); font-weight: 700; }

.progress-track {
    width: 100%;
    height: 8px;
    background: #e1e1e6;
    border-radius: 999px;
    overflow: hidden;
    position: relative;
}

.progress-fill {
    position: relative;
    width: 0%;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.15s ease-out;
}

.sheet-overlay {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s ease, visibility .25s ease;
}

.sheet-overlay.active { opacity: 1; visibility: visible; }

.sheet-modal {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: min(82vh, 460px);
    display: flex;
    flex-direction: column;
    padding: 20px 16px 16px;
    overflow: hidden;
    border-radius: 24px;
    background: #ffffff;
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px rgba(0,0,0,.1);
    transform: translateY(15px) scale(.98);
    opacity: 0;
    transition: transform .3s var(--spring), opacity .25s ease;
}

.sheet-overlay.active .sheet-modal { transform: translateY(0) scale(1); opacity: 1; }

.sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.sheet-title {
    font-size: 16.5px;
    font-weight: 700;
    color: var(--text);
}

.sheet-close {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: #fbfbfd;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background .2s ease;
}

.sheet-close:hover { background: #f1f1f5; }

.sheet-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    padding-right: 4px;
}

.category-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
    padding-left: 4px;
}

.sheet-item {
    min-height: 50px;
    padding: 8px 12px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fbfbfd;
    border: 1px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s ease;
}

.sheet-item:hover {
    background: #f1f1f5;
    border-color: #d1d1d6;
}

.sheet-item.selected {
    background: rgba(0, 102, 204, 0.05);
    border-color: var(--accent);
}

.sheet-item-main { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }

.app-icon {
    width: 32px;
    height: 32px;
    min-width: 32px;
    min-height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    background: #e1e1e6;
}

.sheet-info-box { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.sheet-item span.app-name { color: var(--text); font-size: 13.5px; font-weight: 550; }

.ios-badge {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    background: #f1f1f5;
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 6px;
    flex-shrink: 0;
}

.last-update {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(25px, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .3px;
    z-index: 20;
    pointer-events: none;
}
</style>
</head>

<body>

<script>
let selectedAppUrl = "";
let isInstalling = false;

function openSheet() {
    document.getElementById("sheetOverlay").classList.add("active");
}

function closeSheet() {
    document.getElementById("sheetOverlay").classList.remove("active");
}

function selectApp(element, url, name) {
    selectedAppUrl = url;
    document.getElementById("selectedAppText").textContent = name;
    document.getElementById("selectedAppText").style.color = "var(--text)";

    document.querySelectorAll(".sheet-item").forEach(item => item.classList.remove("selected"));
    element.classList.add("selected");

    closeSheet();
}

function startInstallation() {
    if (!selectedAppUrl || isInstalling) return;

    isInstalling = true;

    setTimeout(() => {
        const progressContainer = document.getElementById("progressContainer");
        const progressBox = progressContainer.querySelector(".progress-box");
        const progressFill = document.getElementById("progressFill");
        const progressText = document.getElementById("progressText");
        const progressStatus = document.getElementById("progressStatus");

        progressContainer.classList.add("active");
        progressBox.classList.remove("completed");
        progressFill.style.width = "0%";
        progressText.textContent = "0%";
        progressStatus.textContent = "Подготовка...";

        const duration = 2000;
        const intervalTime = 100;
        let elapsed = 0;

        const timer = setInterval(() => {
            elapsed += intervalTime;
            let percent = Math.min(Math.floor((elapsed / duration) * 100), 100);

            progressFill.style.width = percent + "%";
            progressText.textContent = percent + "%";

            if (percent <= 30) progressStatus.textContent = "Подготовка...";
            else if (percent < 100) progressStatus.textContent = "Установка...";

            if (elapsed >= duration) {
                clearInterval(timer);
                isInstalling = false;

                setTimeout(() => {
                    progressStatus.textContent = "Установка завершена";
                    progressBox.classList.add("completed");
                    
                    setTimeout(() => {
                        progressContainer.classList.remove("active");
                        progressBox.classList.remove("completed");
                    }, 2200);
                }, 500);
            }
        }, intervalTime);
    }, 500);

    window.location.href = selectedAppUrl;
}
</script>

<!-- MAIN SCREEN -->
<div class="container" id="mainApp">
    <div class="header-section">
        <h1>Установка приложений</h1>
    </div>
    <div class="card">
        <label>Выберите приложение</label>
        <button type="button" class="custom-select-btn" onclick="openSheet()">
            <span id="selectedAppText" style="color:var(--muted);">Нажмите для выбора приложения</span>
        </button>
        <button type="button" class="btn" onclick="startInstallation()">Установить</button>

        <div class="support-notice">
            Возникли вопросы? <a href="#" target="_blank" rel="noopener noreferrer">Напишите в поддержку</a>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-box">
                <div class="progress-info">
                    <span id="progressStatus">Подготовка...</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="progress-track">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- APP SELECTION SHEET -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()">
    <div class="sheet-modal" onclick="event.stopPropagation()">
        <div class="sheet-header">
            <div class="sheet-title">Выбор приложения</div>
            <button type="button" class="sheet-close" onclick="closeSheet()">✕</button>
        </div>

        <div class="sheet-list">
            <!-- Категория 1 -->
            <div>
                <div class="category-title">Категория 1</div>
                <div class="sheet-item" onclick="selectApp(this, 'itms-services://?action=download-manifest&url=https://example.com/app1.plist', 'Приложение №1')">
                    <div class="sheet-item-main">
                        <div class="app-icon"></div>
                        <div class="sheet-info-box"><span class="app-name">Приложение №1</span></div>
                    </div>
                    <span class="ios-badge">iOS 16+</span>
                </div>
            </div>
      
            <!-- Категория 2 -->
            <div>
                <div class="category-title">Категория 2</div>
                <div class="sheet-item" onclick="selectApp(this, 'itms-services://?action=download-manifest&url=https://example.com/app2.plist', 'Приложение №2')">
                    <div class="sheet-item-main">
                        <div class="app-icon"></div>
                        <div class="sheet-info-box"><span class="app-name">Приложение №2</span></div>
                    </div>
                    <span class="ios-badge">iOS 15+</span>
                </div>
            </div>

            <!-- Категория 3 -->
            <div>
                <div class="category-title">Категория 3</div>
                <div class="sheet-item" onclick="selectApp(this, 'itms-services://?action=download-manifest&url=https://example.com/app3.plist', 'Приложение №3')">
                    <div class="sheet-item-main">
                        <div class="app-icon"></div>
                        <div class="sheet-info-box"><span class="app-name">Приложение №3</span></div>
                    </div>
                    <span class="ios-badge">iOS 17+</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="last-update">Шаблон страницы с категориями</div>

</body>
</html>
